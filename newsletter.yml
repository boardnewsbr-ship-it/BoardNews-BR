name: BoardNews BR — Newsletter Diária

on:
  schedule:
    # Executa todos os dias às 08:00 horário de Brasília (11:00 UTC)
    - cron: '0 11 * * *'
  workflow_dispatch: # Permite execução manual pelo GitHub

permissions:
  contents: write  # Necessário para commitar o newsletter.db atualizado

jobs:
  send-newsletter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          # Garante que o git push posterior funcione com o token padrão
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configura Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instala dependências
        run: pip install -r requirements.txt

      - name: Executa a newsletter
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BGG_API_TOKEN: ${{ secrets.BGG_API_TOKEN }}
        run: python main.py

      - name: Persiste o banco de dados no repositório
        # Salva o newsletter.db atualizado para que a deduplicação de 30 dias
        # funcione corretamente na próxima execução
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add newsletter.db
          git diff --cached --quiet || git commit -m "chore: atualiza newsletter.db [skip ci]"
          git push
