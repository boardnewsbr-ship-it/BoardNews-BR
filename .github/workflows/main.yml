name: Daily Board Game Newsletter

on:
  schedule:
    # Roda todos os dias às 09:30 UTC (06:30 no Horário de Brasília UTC-3)
    - cron: '30 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-newsletter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Chrome
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -q
          sudo apt-get install -y google-chrome-stable

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Newsletter Script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BGG_API_TOKEN: ${{ secrets.BGG_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python main.py

      - name: Commit and Push SQLite Database Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if [ -f newsletter.db ]; then
            git checkout ${{ github.ref_name }} || git checkout -b ${{ github.ref_name }} origin/${{ github.ref_name }}
            git add newsletter.db
            if ! git diff --cached --quiet; then
              git commit -m "chore: atualiza banco de dados da newsletter [skip ci]"

              success=false
              for i in {1..5}; do
                echo "Tentativa $i..."
                git fetch origin ${{ github.ref_name }}
                if git pull origin ${{ github.ref_name }} --rebase -X ours; then
                  if git push origin ${{ github.ref_name }}; then
                    success=true
                    break
                  fi
                fi
                sleep 5
              done

              if [ "$success" = false ]; then
                echo "Erro: push falhou após 5 tentativas."
                exit 1
              fi
            else
              echo "Nenhuma alteração no banco de dados."
            fi
          fi
