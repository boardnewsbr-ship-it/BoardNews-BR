name: BoardNews BR — Newsletter Diária

on:
  schedule:
    # Executa todos os dias às 06:30 horário de Brasília (09:30 UTC)
    - cron: '30 9 * * *'
  workflow_dispatch: # Permite execução manual pelo GitHub

permissions:
  contents: write  # Necessário para commitar o newsletter.db atualizado

# Evita duas execuções simultâneas (ex: cron + disparo manual) mexendo no newsletter.db
concurrency:
  group: boardnews-newsletter
  cancel-in-progress: false

jobs:
  send-newsletter:
    # Versão fixa em vez de "ubuntu-latest": o latest migrou para o Ubuntu 26
    # em out/2026, onde o método antigo de instalar o Chrome (apt-key) quebrou.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configura Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instala Chrome
        run: |
          # Os runners do GitHub normalmente já vêm com o Chrome instalado.
          # Só instala se não houver, usando o método atual (keyring em
          # /etc/apt/keyrings) no lugar do apt-key, que foi removido.
          if command -v google-chrome >/dev/null 2>&1; then
            echo "Chrome já instalado."
          else
            sudo install -d -m 0755 /etc/apt/keyrings
            wget -qO- https://dl.google.com/linux/linux_signing_key.pub \
              | sudo gpg --dearmor -o /etc/apt/keyrings/google-chrome.gpg
            echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" \
              | sudo tee /etc/apt/sources.list.d/google-chrome.list
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable
          fi
          google-chrome --version

      - name: Instala dependências
        run: pip install -r requirements.txt

      - name: Executa a newsletter
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BGG_API_TOKEN: ${{ secrets.BGG_API_TOKEN }}
        run: python main.py

      - name: Persiste o banco de dados no repositório
        # Salva o newsletter.db atualizado para que a deduplicação funcione
        # na próxima execução. Tenta até 5 vezes com rebase caso o push seja
        # rejeitado (ex: alguém commitou no repositório durante a execução).
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add newsletter.db
          if git diff --cached --quiet; then
            echo "newsletter.db sem alterações, nada a commitar."
            exit 0
          fi
          git commit -m "chore: atualiza newsletter.db [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push concluído na tentativa $i."
              exit 0
            fi
            echo "Push falhou (tentativa $i/5). Fazendo rebase e tentando de novo..."
            git pull --rebase --autostash -X theirs origin main || true
            sleep 3
          done
          echo "Não foi possível enviar o newsletter.db após 5 tentativas."
          exit 1
