name: BoardNews BR — Newsletter Diária

on:
  schedule:
    # Executa todos os dias às 09:30 UTC (06:30 horário de Brasília)
    - cron: '30 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-newsletter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configura Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instala Chrome
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -q
          sudo apt-get install -y google-chrome-stable

      - name: Instala dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executa a newsletter
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BGG_API_TOKEN: ${{ secrets.BGG_API_TOKEN }}
        run: python main.py

      - name: Persiste o banco de dados no repositório
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -f newsletter.db ]; then
            git checkout ${{ github.ref_name }} || git checkout -b ${{ github.ref_name }} origin/${{ github.ref_name }}
            git add newsletter.db
            if ! git diff --cached --quiet; then
              git commit -m "chore: atualiza newsletter.db [skip ci]"

              success=false
              for i in {1..5}; do
                echo "Tentativa $i de push..."
                git fetch origin ${{ github.ref_name }}
                if git pull origin ${{ github.ref_name }} --rebase -X ours; then
                  if git push origin ${{ github.ref_name }}; then
                    echo "newsletter.db persistido com sucesso!"
                    success=true
                    break
                  fi
                fi
                sleep 5
              done

              if [ "$success" = false ]; then
                echo "Erro: push falhou após 5 tentativas."
                exit 1
              fi
            else
              echo "Nenhuma alteração no banco de dados."
            fi
          fi
